apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-configmap
  namespace: default
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS moon_database;

    USE moon_database;

    CREATE TABLE IF NOT EXISTS agents (
      agent_id INT AUTO_INCREMENT PRIMARY KEY,
      agent_code VARCHAR(255) NOT NULL,
      agent_name VARCHAR(255) NOT NULL,
      agent_email VARCHAR(255) NOT NULL,
      agent_phone VARCHAR(20) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS products (
      product_id INT AUTO_INCREMENT PRIMARY KEY,
      product_name VARCHAR(255) NOT NULL,
      product_description TEXT NOT NULL
    );

    CREATE TABLE IF NOT EXISTS agent_product (
      agent_id INT,
      product_id INT,
      PRIMARY KEY (agent_id, product_id),
      FOREIGN KEY (agent_id) REFERENCES agents(agent_id),
      FOREIGN KEY (product_id) REFERENCES products(product_id)
    );

    CREATE TABLE IF NOT EXISTS sales (
      sale_id INT AUTO_INCREMENT PRIMARY KEY,
      agent_id INT,
      product_id INT,
      sale_amount DECIMAL(10, 2),
      sale_date DATE,
      FOREIGN KEY (agent_id) REFERENCES agents(agent_id),
      FOREIGN KEY (product_id) REFERENCES products(product_id)
    );

    INSERT INTO agents (agent_code, agent_name, agent_email, agent_phone)
    VALUES
      ('A001', 'John Doe', 'john.doe@example.com', '123-456-7890'),
      ('A002', 'Jane Smith', 'jane.smith@example.com', '234-567-8901'),
      ('A003', 'James Brown', 'james.brown@example.com', '345-678-9012');

    INSERT INTO products (product_name, product_description)
    VALUES
      ('Life Insurance', 'A life insurance product'),
      ('Health Insurance', 'A health insurance product'),
      ('Car Insurance', 'A car insurance product');

    INSERT INTO agent_product (agent_id, product_id)
    VALUES
      (1, 1), (1, 2),
      (2, 1), (3, 3);

    INSERT INTO sales (agent_id, product_id, sale_amount, sale_date)
    VALUES
      (1, 1, 500.00, '2025-04-01'),
      (1, 2, 300.00, '2025-04-02'),
      (2, 1, 600.00, '2025-04-02'),
      (3, 3, 400.00, '2025-04-03');
