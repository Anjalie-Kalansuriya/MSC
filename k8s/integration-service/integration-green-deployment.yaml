apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-service-green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integration-service
      version: green
  template:
    metadata:
      labels:
        app: integration-service
        version: green
    spec:
      containers:
        - name: integration-service
          image: anjalie19/integration-service:latest
          ports:
            - containerPort: 5002
