name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job to set up Docker and build Docker images
  docker_build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build agent-service Docker image
        run: |
          docker build -t anjalie19/agent-service:latest -t anjalie19/agent-service:${GITHUB_SHA} ./agent-service
          docker push anjalie19/agent-service:latest
          docker push anjalie19/agent-service:${GITHUB_SHA}

      - name: Build aggregator-service Docker image
        run: |
          docker build -t anjalie19/aggregator-service:latest -t anjalie19/aggregator-service:${GITHUB_SHA} ./aggregator-service
          docker push anjalie19/aggregator-service:latest
          docker push anjalie19/aggregator-service:${GITHUB_SHA}

      - name: Build integration-service Docker image
        run: |
          docker build -t anjalie19/integration-service:latest -t anjalie19/integration-service:${GITHUB_SHA} ./integration-service
          docker push anjalie19/integration-service:latest
          docker push anjalie19/integration-service:${GITHUB_SHA}

      - name: Build notification-service Docker image
        run: |
          docker build -t anjalie19/notification-service:latest -t anjalie19/notification-service:${GITHUB_SHA} ./notification-service
          docker push anjalie19/notification-service:latest
          docker push anjalie19/notification-service:${GITHUB_SHA}

  # Job for Blue-Green Deployment in Kubernetes
  k8s_blue_green_deploy:
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Kubernetes
        uses: azure/setup-kubernetes-action@v1
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy agent-service (Blue-Green)
        run: |
          kubectl apply -f ./k8s/agent-service/agent-deployment-blue.yaml
          kubectl apply -f ./k8s/agent-service/service.yaml
          
      - name: Deploy aggregator-service (Blue-Green)
        run: |
          kubectl apply -f ./k8s/aggregator-service/aggregator-deployment-blue.yaml
          kubectl apply -f ./k8s/aggregator-service/service.yaml

      - name: Deploy integration-service (Blue-Green)
        run: |
          kubectl apply -f ./k8s/integration-service/integration-deployment-blue.yaml
          kubectl apply -f ./k8s/integration-service/service.yaml

      - name: Deploy notification-service (Blue-Green)
        run: |
          kubectl apply -f ./k8s/notification-service/notification-deployment-blue.yaml
          kubectl apply -f ./k8s/notification-service/service.yaml

      - name: Switch Traffic to Blue (Production)
        run: |
          kubectl rollout status deployment/agent-service-blue
          kubectl set image deployment/agent-service agent-service=anjalie19/agent-service:${GITHUB_SHA} --record
          kubectl rollout status deployment/aggregator-service-blue
          kubectl set image deployment/aggregator-service aggregator-service=anjalie19/aggregator-service:${GITHUB_SHA} --record
          kubectl rollout status deployment/integration-service-blue
          kubectl set image deployment/integration-service integration-service=anjalie19/integration-service:${GITHUB_SHA} --record
          kubectl rollout status deployment/notification-service-blue
          kubectl set image deployment/notification-service notification-service=anjalie19/notification-service:${GITHUB_SHA} --record

      - name: Verify Deployment
        run: |
          kubectl get all
          kubectl describe deployment agent-service-blue
          kubectl describe deployment aggregator-service-blue
          kubectl describe deployment integration-service-blue
          kubectl describe deployment notification-service-blue
          
  # Job to run post-deployment tests
  post_deployment_tests:
    runs-on: ubuntu-latest
    needs: k8s_blue_green_deploy
    steps:
      - name: Run post-deployment tests
        run: |
          curl -f http://agent-service-blue/health || exit 1
          curl -f http://aggregator-service-blue/health || exit 1
          curl -f http://integration-service-blue/health || exit 1
          curl -f http://notification-service-blue/health || exit 1

